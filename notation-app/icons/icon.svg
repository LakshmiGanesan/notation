<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2246"/>
      <stop offset="1" stop-color="#0e1120"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="-1" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#f6d28a"/>
      <stop offset=".5" stop-color="#e0a043"/>
      <stop offset="1" stop-color="#b7741f"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4378"/>
      <stop offset=".35" stop-color="#1f2550"/>
      <stop offset="1" stop-color="#0b0e1f"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="114" fill="url(#tile)"/>

  <!-- notebook -->
  <g>
    <rect x="112" y="84" width="284" height="344" rx="26" fill="#fbf8f2"/>
    <!-- saffron spine -->
    <path d="M138 84h20v344h-20a26 26 0 0 1-26-26V110a26 26 0 0 1 26-26z" fill="#d9731a"/>
    <g fill="#fbf8f2">
      <circle cx="136" cy="140" r="5.5"/><circle cx="136" cy="212" r="5.5"/>
      <circle cx="136" cy="284" r="5.5"/><circle cx="136" cy="356" r="5.5"/>
    </g>
    <!-- header band -->
    <rect x="186" y="116" width="182" height="22" rx="4" fill="#f3e3cf"/>
    <!-- rows -->
    <g stroke="#e4dacb" stroke-width="2.5" stroke-linecap="round">
      <path d="M186 138h182M186 198.7h182M186 259.3h182M186 320.0h182M186 380.7h182"/>
    </g>
    <!-- tāḷa divisions: laghu 4 | drutam 2 | drutam 2 -->
    <g stroke="#c4b7a1" stroke-width="3" stroke-linecap="round">
      <path d="M186.0 116V380.7M246.7 116V380.7M307.3 116V380.7M368.0 116V380.7"/>
    </g>
  </g>

  <!-- "S" for Sa, the ādhāra ṣaḍja -->
  <g transform="translate(216.3 350.3) scale(0.561) translate(-221 -322) translate(222 322) skewX(-14) translate(-222 -322)" fill="none" stroke="#14182e" stroke-linecap="round" stroke-linejoin="round">
    <path d="M243 298C236 283 207 282 202 300C198 316 242 314 243 336C244 357 210 361 196 343" stroke-width="8.9"/>
    <path d="M205 309C214 320 238 319 242 333" stroke-width="19.6"/>
    <path d="M243 298l3-5" stroke-width="8.9"/>
  </g>

  <!-- fountain pen: tip at (262,336), rising to the upper right -->
  <g transform="translate(252.7 363.7) rotate(-45)">
    <!-- cream halo separates the pen from the navy tile -->
    <g fill="#fbf8f2" stroke="#fbf8f2" stroke-width="12" stroke-linejoin="round">
      <rect x="80" y="-19" width="190" height="38" rx="19"/>
      <rect x="262" y="-22" width="44" height="44" rx="20"/>
      <path d="M172 -24H252a6 6 0 0 1 0 12H172z"/>
    </g>
    <!-- nib -->
    <path d="M0 0C24-5 50-15 82-17V17C50 15 24 5 0 0Z" fill="url(#gold)"/>
    <path d="M7 0H52" stroke="#5a3a10" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="54" cy="0" r="4.5" fill="#5a3a10"/>
    <!-- section, ring, barrel -->
    <rect x="80" y="-18" width="34" height="36" rx="7" fill="#0b0e1f"/>
    <rect x="112" y="-20" width="9" height="40" rx="2.5" fill="url(#gold)"/>
    <rect x="119" y="-19" width="150" height="38" fill="url(#barrel)"/>
    <rect x="134" y="-12" width="120" height="5.5" rx="2.75" fill="#fff" opacity=".22"/>
    <!-- clip -->
    <path d="M172 -26H252a7 7 0 0 1 0 14H180z" fill="url(#gold)"/>
    <circle cx="177" cy="-19" r="6" fill="url(#gold)"/>
    <!-- microphone head, where an eraser would be -->
    <rect x="262" y="-21" width="44" height="42" rx="19" fill="#d9731a"/>
    <path d="M276 -13v26M285 -15v30M294 -13v26" stroke="#fbf8f2" stroke-width="2.6" stroke-linecap="round" opacity=".75"/>
    <rect x="262" y="-21" width="44" height="42" rx="19" fill="none" stroke="#b85d10" stroke-width="1.5" opacity=".6"/>
    <!-- gold ferrule joining barrel and microphone -->
    <rect x="258" y="-21.5" width="14" height="43" rx="3" fill="url(#gold)"/>
    <path d="M262 -21v42M267 -21v42" stroke="#9a5f18" stroke-width="1.2" opacity=".6"/>
  </g>
</svg>
