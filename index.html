<style>
:root{
  --ink:#14182e; --navy:#0e1120; --paper:#fbf8f2; --desk:#efe8db; --card:#fffdf9;
  --saffron:#d9731a; --saffron-2:#b85d10; --saffron-soft:#f8e3cd;
  --line:#e3d9c8; --muted:#6f685b; --rec:#c8372d; --ok:#2f7d55;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:15px}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
input[type=text]{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}

/* ---------- Library ---------- */
#library{min-height:100%;padding:calc(28px + var(--sat)) calc(28px + var(--sar)) calc(40px + var(--sab)) calc(28px + var(--sal));max-width:1360px;margin:0 auto}
.lib-body{display:grid;grid-template-columns:240px 1fr;gap:30px;align-items:start}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px}
.side h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 10px 6px;font-weight:600}
.fitem{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;padding:0 6px 0 10px;border:none;background:transparent;border-radius:11px;text-align:left;font-size:15px}
.fitem:hover{background:rgba(255,253,249,.7)}
.fitem.on{background:var(--card);box-shadow:0 1px 0 var(--line),0 6px 14px -12px rgba(14,17,32,.5);font-weight:600}
.fitem.sub{padding-left:34px;font-size:14px;min-height:40px}
.fitem svg.fi{width:19px;height:19px;flex:none;color:var(--saffron)}
.fitem.sub svg.fi{width:16px;height:16px;opacity:.8}
.fitem .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem .ct{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.fitem .fm{width:32px;height:32px;border-radius:8px;border:none;background:transparent;display:grid;place-items:center;opacity:.55;flex:none}
.fitem .fm:hover{opacity:1;background:#efe6d6}
.fitem .fm svg{width:16px;height:16px}
.newf{color:var(--saffron-2);font-weight:500}
.crumb{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.crumb h2{font-family:var(--serif);font-weight:500;font-size:26px;margin:0}
.crumb .up{font-family:var(--serif);font-size:26px;color:var(--muted);cursor:pointer}
.crumb .cnt{color:var(--muted);font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.fgrid:empty{display:none}
.ftile{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;cursor:pointer;min-height:64px}
.ftile:hover{border-color:var(--saffron)}
.ftile svg{width:26px;height:26px;color:var(--saffron);flex:none}
.ftile b{font-family:var(--serif);font-weight:500;font-size:17px;display:block}
.ftile span{color:var(--muted);font-size:12px}
.ftile.add{border-style:dashed;color:var(--saffron-2)}
.fpick{display:flex;flex-direction:column;gap:4px}
.fpick button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:44px;padding:0 14px;display:flex;align-items:center;gap:10px;font-size:15px}
.fpick button.sub{margin-left:26px;font-size:14px}
.fpick button.on{border-color:var(--saffron);background:var(--saffron-soft)}
.fpick svg{width:17px;height:17px;color:var(--saffron)}
.tinput{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.tinput:focus{border-color:var(--saffron)}
@media (max-width:820px){
  .lib-body{grid-template-columns:1fr;gap:14px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
  .side h4{display:none}
  .fitem,.fitem.sub{width:auto;flex:none;padding:0 12px;border:1px solid var(--line);background:var(--card)}
  .fitem .fm{display:none}
}
.lib-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.wordmark{font-family:var(--serif);font-weight:650;font-size:42px;letter-spacing:-.02em;line-height:1;margin:0;display:flex;align-items:center;gap:12px}
.wordmark .mark{width:52px;height:52px;border-radius:13px;box-shadow:0 8px 18px -10px rgba(14,17,32,.6)}
.tagline{color:var(--muted);margin:8px 0 0 2px;font-size:15px}
.lib-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:500;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn:hover{border-color:#cdbfa8}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#23284a}
.btn.danger{color:var(--rec)}
.verchip{font-size:13px;color:var(--muted);padding:10px 12px}
.verchip.new{color:#fff;background:var(--saffron);border-color:var(--saffron);font-weight:600}
.drivechip span{font-variant-numeric:tabular-nums}
.drivechip.warn{color:var(--saffron-2);border-color:#ecc49c;background:var(--saffron-soft)}
.drivechip.spin svg{animation:pulse 1.2s infinite}
.btn svg{width:18px;height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;transition:transform .15s,box-shadow .15s;cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(20,24,46,.35)}
.nudge{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;background:#fbf3e6;border:1px solid #ecd9b8;border-left:4px solid #c8641e;border-radius:16px;padding:18px 22px;margin:0 0 22px}
.nudge-txt{flex:1 1 420px;font-size:15px;line-height:1.55}.nudge-txt p{margin:0 0 6px}.nudge-hi{font-family:var(--serif,Georgia,serif);font-size:20px}
.nudge-txt ol{margin:6px 0 0;padding-left:20px}.nudge-acts{display:flex;flex-wrap:wrap;gap:8px}.nudge-acts a.btn{text-decoration:none;color:inherit}
.card .sharedbadge{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 7px;border:0;border-radius:999px;background:#c8641e;color:#fff;font:600 12px/1.2 inherit;font-family:inherit;box-shadow:0 1px 4px rgba(0,0,0,.18);cursor:pointer}
.card .sharedbadge svg{width:14px;height:14px}
.card .thumb{aspect-ratio:2388/1668;background:#fff center/cover no-repeat;border-bottom:1px solid var(--line)}
.card .meta{padding:12px 14px 14px}
.card .title{font-family:var(--serif);font-weight:500;font-size:18px;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px}
.chip svg{width:14px;height:14px}
.card .more{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:10px;border:none;background:rgba(255,253,249,.92);display:grid;place-items:center;opacity:.9}
.card .more svg{width:18px;height:18px}
.empty{border:1.5px dashed #d4c7b2;border-radius:18px;padding:48px 28px;text-align:center;color:var(--muted);background:rgba(255,253,249,.5)}
.empty h2{font-family:var(--serif);font-weight:500;color:var(--ink);font-size:24px;margin:0 0 8px}
.empty p{max-width:520px;margin:0 auto 18px;line-height:1.55}

/* ---------- Editor ---------- */
#editor{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:auto 1fr;background:var(--desk)}
#editor>.topbar,#editor>.player{grid-column:1/-1}
#editor>#pages{grid-column:2;grid-row:2;min-width:0}
#pside{grid-column:1;grid-row:2;width:212px;display:none;flex-direction:column;min-height:0;background:var(--paper);border-right:1px solid var(--line)}
#editor.side-open #pside{display:flex}
#editor.side-open{--pw:calc(100vw - 213px)}
.ps-head{display:flex;align-items:center;gap:6px;padding:10px 8px 8px 12px;border-bottom:1px solid var(--line)}
.ps-head b{font-size:14px;flex:1;min-width:0}.ps-head .seg button{font-size:12px;padding:4px 8px;white-space:nowrap}.ps-head .seg{flex:none}.ps-x{margin-left:auto}.ps-x{width:30px;height:30px}
.ps-list{overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 30px;flex:1;min-height:0}
.ps-item{position:relative;display:block;width:100%;border:0;background:none;padding:6px;border-radius:12px;text-align:left;cursor:pointer;margin-bottom:4px;font:inherit;color:inherit}
.ps-item.cur{background:rgba(200,100,30,.12)}
.ps-item canvas{display:block;width:100%;aspect-ratio:var(--ar);border-radius:6px;border:1px solid var(--line);background:#fff}
.ps-item.cur canvas{outline:2px solid #c8641e;outline-offset:1px}
.ps-cap{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:12px;min-height:22px}
.ps-no{color:var(--muted);font-variant-numeric:tabular-nums;min-width:18px}
.ps-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ps-btn{border:0;background:none;padding:2px 4px;border-radius:6px;font-size:15px;line-height:1;color:var(--muted);cursor:pointer}

.ibtn{width:44px;height:44px;min-width:44px;border-radius:11px;border:1px solid transparent;background:transparent;display:grid;place-items:center;position:relative}

.ibtn:hover{background:#f1ebe0}

.sep{width:1px;height:28px;background:var(--line);margin:0 4px;flex:none}
.title-input{border:none;background:transparent;font-family:var(--serif);font-weight:500;font-size:19px;padding:6px 8px;border-radius:8px;min-width:92px;width:12ch;outline:none}
.palbtn{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:3px;flex:none;display:grid;place-items:center}
.palbtn i{display:block;width:100%;height:100%;border-radius:50%;background:conic-gradient(#c0392b,#d9731a,#e8c33a,#1e7d4f,#1f5fbf,#7a3fb5,#c0392b);box-shadow:inset 0 0 0 2px #fff}
.palbtn.on{border-color:var(--ink)}
.palbtn.on i{box-shadow:inset 0 0 0 5px var(--cur,#fff)}
.ctxseg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.ctxseg button{border:none;background:var(--card);padding:0 12px;height:36px;font-size:13px;font-weight:600}
.ctxseg button.on{background:var(--ink);color:#fff}
.ctxbtn{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:13px;font-weight:600;flex:none;margin-left:6px}
.ctxbtn:disabled{opacity:.35}
#popover{position:fixed;z-index:45;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 40px -18px rgba(14,17,32,.45);padding:14px;width:300px}
.takes .take{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.takes .take.on{border-color:var(--saffron);box-shadow:0 0 0 3px var(--saffron-soft)}
.takes .tplay{width:38px;height:38px;border-radius:50%;border:none;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.takes .tplay svg{width:16px;height:16px}
.takes .tno{font-variant-numeric:tabular-nums;font-weight:700;color:var(--saffron-2);width:24px}
.takes .tinfo{flex:1;min-width:0;display:flex;flex-direction:column}
.takes .tinfo b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.takes .tinfo small{color:var(--muted);font-size:12px}
.takes .mini:disabled{opacity:.3}
.takeopts{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap;font-size:14px}
.takeopts input{width:18px;height:18px;vertical-align:-3px;accent-color:var(--saffron)}
.speeds{display:flex;gap:6px}
.speeds button{flex:1;min-height:50px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.speeds button small{font-size:9.5px;font-weight:500;color:var(--muted)}
.speeds button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.speeds button.on small{color:#cfd3e6}
#popover h5{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.pgrid .sw{width:36px;height:36px;position:relative}
.pgrid .sw .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:11px;line-height:16px;text-align:center;color:var(--muted)}
.prow{display:flex;gap:8px}
.prow button{flex:1;min-height:42px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600}
.prow svg{width:17px;height:17px}
#selbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + var(--sat));z-index:40;display:flex;gap:4px;background:var(--navy);color:#fff;border-radius:14px;padding:5px;box-shadow:0 14px 30px -14px rgba(0,0,0,.6)}
#selbar button{border:none;background:transparent;color:#fff;font-size:13px;font-weight:600;height:38px;padding:0 12px;border-radius:10px;display:inline-flex;align-items:center;gap:6px}
#selbar button:hover{background:rgba(255,255,255,.12)}
#selbar .dot{width:14px;height:14px;border-radius:50%;background:conic-gradient(#c0392b,#d9731a,#e8c33a,#1e7d4f,#1f5fbf,#7a3fb5,#c0392b)}
body.picking .page canvas.fx{cursor:crosshair}
.title-input:focus{background:#f1ebe0}
.spacer{flex:1}
.swatches{display:flex;gap:4px;align-items:center}
.sw{width:29px;height:29px;border-radius:50%;border:2px solid transparent;padding:3px;background-clip:content-box;flex:none}
.sw.on{border-color:var(--ink)}
.sizes{display:flex;gap:2px}
.sz{width:36px;height:44px;border:none;background:transparent;border-radius:9px;display:grid;place-items:center}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz.on{background:#ebe3d5}
#pages{overflow:auto;-webkit-overflow-scrolling:touch;padding:18px calc(16px + var(--sar)) 40px calc(16px + var(--sal));position:relative}
.page{position:relative;margin:0 auto 22px;background:#fff;box-shadow:0 1px 0 #d9cfbf,0 14px 30px -18px rgba(20,24,46,.35);border-radius:4px;overflow:hidden}
.page img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply}
.page canvas.fx{touch-action:pan-x pan-y pinch-zoom}
body.fingers .page canvas.fx{touch-action:none}
.page .pno{position:absolute;bottom:6px;right:10px;font-size:11px;color:#aaa;pointer-events:none}
.addpage{display:flex;justify-content:center;margin:0 auto 30px}
.page .pmenu{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,253,249,.92);display:grid;place-items:center;z-index:2;opacity:.75}
.page .pmenu:hover{opacity:1}
.page .pmenu svg{width:18px;height:18px}
#pagePill{position:absolute;right:calc(18px + var(--sar));bottom:calc(84px + var(--sab));z-index:4;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:rgba(255,253,249,.95);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;box-shadow:0 6px 16px -10px rgba(14,17,32,.5)}

/* player */
.player{display:flex;align-items:center;gap:10px;padding:10px calc(14px + var(--sar)) calc(10px + var(--sab)) calc(14px + var(--sal));background:var(--paper);border-top:1px solid var(--line)}
.recbtn{height:46px;border-radius:23px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:8px;padding:0 16px 0 12px;font-weight:600;white-space:nowrap;flex:none}
.recbtn .rd{width:16px;height:16px;border-radius:50%;background:var(--rec)}
.recbtn.live{background:var(--rec);color:#fff;border-color:var(--rec)}
.recbtn.live .rd{background:#fff;border-radius:3px;width:13px;height:13px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
.playbtn{width:48px;height:48px;border-radius:50%;border:none;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.playbtn svg{width:22px;height:22px}
.playbtn:disabled{opacity:.3;cursor:default}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap;min-width:92px;text-align:center}
.time b{color:var(--ink);font-weight:600}
.track{flex:1;height:44px;position:relative;cursor:pointer;touch-action:none;min-width:80px}
.track .rail{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:#e6dccb}
.track .fill{position:absolute;left:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--ink);width:0}
.track .knob{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:2px solid var(--ink);left:0;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.track .tick{position:absolute;top:8px;width:3px;height:10px;margin-left:-1.5px;border-radius:2px;background:var(--saffron)}
.track .tick.on{background:var(--rec);height:14px;top:5px}
.pill{height:38px;border-radius:19px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.pill svg{width:16px;height:16px}
.pill.on{background:var(--saffron-soft);border-color:#ecc49c;color:var(--saffron-2)}
.pill:disabled{opacity:.35}

#drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);background:var(--paper);border-left:1px solid var(--line);box-shadow:-20px 0 40px -30px rgba(20,24,46,.5);transform:translateX(105%);transition:transform .25s ease;z-index:30;display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab)}
#drawer.open{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px 18px;border-bottom:1px solid var(--line)}
.dh h3{font-family:var(--serif);font-weight:500;font-size:20px;margin:0}
.dlist{overflow:auto;padding:10px;flex:1}
.bm{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px;margin-bottom:8px;cursor:pointer}

.bm canvas{width:100%;display:block;border-radius:6px;background:#fff}

.dempty{color:var(--muted);padding:18px 10px;line-height:1.55;font-size:14px}

#scrim{position:fixed;inset:0;background:rgba(14,17,32,.38);z-index:50;display:grid;place-items:center;padding:20px}
.dlg{background:var(--paper);border-radius:18px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.dlg h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:0 0 10px}
.dlg p,.dlg li{line-height:1.55;color:#3b3a40}

.tabs{margin:0 0 14px}

.tcard:hover,.tcard:focus{border-color:var(--saffron);outline:none;transform:translateY(-1px)}
.tcard .tthumb{aspect-ratio:2388/1668;border-radius:8px;background:#fff center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);margin-bottom:5px}
.tcard .tthumb svg{width:30px;height:30px}
.tcard b{font-family:var(--serif);font-weight:500;font-size:16px}

.tpl{display:flex;gap:14px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px;margin:10px 0;cursor:pointer;width:100%;text-align:left}

.tpl .tim{width:120px;aspect-ratio:2388/1668;border-radius:6px;background:#fff center/cover no-repeat;border:1px solid var(--line);flex:none;display:grid;place-items:center;color:var(--muted)}
.tpl .tim svg{width:30px;height:30px}
.tpl b{font-family:var(--serif);font-weight:500;font-size:17px;display:block}
.tpl span{color:var(--muted);font-size:13px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--card);padding:8px 12px;font-size:13px;font-weight:600}
.seg button.on{background:var(--ink);color:#fff}
 #bootNotice{position:fixed;inset:0;z-index:100;background:var(--desk);display:grid;place-items:center;padding:24px}
#bootNotice .bn{max-width:520px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 20px 40px -20px rgba(0,0,0,.35)}
#bootNotice h2{font-family:var(--serif);font-weight:500;margin:0 0 10px}
#bootNotice p{line-height:1.55;color:#3b3a40}
#bootNotice pre{white-space:pre-wrap;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px}
#bootNotice button{margin-top:8px;min-height:44px;padding:0 18px;border-radius:12px;border:none;background:var(--ink);color:#fff;font:inherit;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}

.banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13px;padding:8px 14px;border-radius:20px;z-index:5;white-space:nowrap;box-shadow:0 8px 20px -10px rgba(0,0,0,.5)}

/* viewer mode (shared file) */
body.viewer .edit-only{display:none!important}
.sharelink{word-break:break-all;background:var(--paper,#f6f3ec);border-radius:10px;padding:10px 12px;font-size:15px;margin:6px 0 10px}
.sharelink a{color:inherit}
.sharerow{display:flex;gap:10px;align-items:center}.sharerow .sharelink{flex:1;margin:6px 0}
.viewer-only{display:none}

.vtitle{font-family:var(--serif);font-weight:500;font-size:19px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width:760px){
  .time{min-width:0}
  .hide-sm{display:none!important}
  .wordmark{font-size:34px}
}

<script>
'use strict';
/* ==========================================================
   Notation — prototype 0.1
   Ink + audio + bookmarks for music notation.
   ========================================================== */
const APP_SRC = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = s => { if (!isFinite(s) || s < 0) s = 0; s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const PEN_COLORS = ['#14182e', '#1f5fbf', '#c0392b', '#1e7d4f', '#d9731a'];
const HL_COLORS = ['rgba(255,210,0,0.42)', 'rgba(255,120,170,0.36)', 'rgba(110,215,140,0.38)', 'rgba(90,190,255,0.34)'];
const PEN_SIZES = [1.5, 2.2, 3.0, 3.9, 5.0];   // even-weight pen, sizes 1–5 (page px at 1920 wide)
const CALLI_SIZES = [7, 11, 16];               // calligraphy nib widths
const HL_SIZES = [16, 26, 40];
const NIB_ANGLE = -0.7;                        // broad nib held at about 40°
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>';

/* ---------------- start-up safety: never leave a blank screen ---------------- */
function bootNotice(kind, detail) {
  let n = document.getElementById('bootNotice');
  if (!n) { n = document.createElement('div'); n.id = 'bootNotice'; document.body.appendChild(n); }
  const msg = kind === 'blocked'
    ? '<h2>Notation is open somewhere else</h2><p>An older copy of Notation is still open on this device, in another Safari tab or as the Home Screen app, and it is holding your notes while this version updates them.</p><p>Close every other Notation tab, and swipe the Home Screen app closed in the app switcher. This page continues on its own once it is free.</p>'
    : kind === 'slow'
    ? '<h2>Notation is taking a while to start</h2><p>If this persists, close other Notation tabs or the Home Screen app, then tap Retry.</p>'
    : `<h2>Notation could not start</h2><p>Something went wrong while opening. Please send this message to Claude:</p><pre>${String(detail || '').replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;').slice(0, 600)}</pre>`;
  n.innerHTML = `<div class="bn">${msg}<button onclick="location.reload()">Retry</button></div>`;
}
function hideBootNotice() { const n = document.getElementById('bootNotice'); if (n) n.remove(); }
let booted = false;
addEventListener('error', e => { if (!booted) bootNotice('error', (e.message || '') + (e.filename ? ` (${e.lineno}:${e.colno})` : '')); });
addEventListener('unhandledrejection', e => { if (!booted) bootNotice('error', e.reason && (e.reason.stack || e.reason.message) || e.reason); });
setTimeout(() => { if (!booted && !document.getElementById('bootNotice')) bootNotice('slow'); }, 8000);

/* ---------------- storage (IndexedDB with memory fallback) ---------------- */
const DB = (() => {
  const mem = { notes: new Map(), pages: new Map(), audio: new Map(), imgs: new Map(), tpls: new Map(), folders: new Map(), sync: new Map() };
  let dbp = null, broken = false;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open('notation', 5);
      r.onupgradeneeded = () => { const d = r.result; for (const n of ['notes', 'pages', 'audio', 'imgs', 'tpls', 'folders', 'sync']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); };
      r.onblocked = () => bootNotice('blocked');
      r.onsuccess = () => {
        const d = r.result;
        d.onversionchange = () => { d.close(); location.reload(); };   // a newer Notation needs the storage: step aside
        hideBootNotice(); res(d);
      };
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function run(store, mode, fn) {
    if (!broken) {
      try {
        const d = await open();
        return await new Promise((res, rej) => {
          const t = d.transaction(store, mode); const req = fn(t.objectStore(store));
          t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
        });
      } catch (e) { console.warn('IndexedDB unavailable, using memory', e); broken = true; }
    }
    return null;
  }
  return {
    async get(st, k) { const r = await run(st, 'readonly', s => s.get(k)); return broken ? mem[st].get(k) : r; },
    async put(st, k, v) { await run(st, 'readwrite', s => s.put(v, k)); if (broken) mem[st].set(k, v); },
    async del(st, k) { await run(st, 'readwrite', s => s.delete(k)); if (broken) mem[st].delete(k); },
    async all(st) { const r = await run(st, 'readonly', s => s.getAll()); return broken ? [...mem[st].values()] : (r || []); },
    async delPrefix(st, p) { await run(st, 'readwrite', s => s.delete(IDBKeyRange.bound(p, p + '￿'))); if (broken) for (const k of [...mem[st].keys()]) if (k.startsWith(p)) mem[st].delete(k); },
    async keysPrefix(st, p) { const r = await run(st, 'readonly', s => s.getAllKeys(IDBKeyRange.bound(p, p + '￿'))); return broken ? [...mem[st].keys()].filter(k => k.startsWith(p)) : (r || []); },
  };
})();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }

/* ---------------- app state ---------------- */
let note = null;            // current note
let viewer = false;         // opened from a shared file
let tool = 'pen';
let penColor = PEN_COLORS[0], calliColor = PEN_COLORS[0], hlColor = HL_COLORS[0];
let penSize = PEN_SIZES[1], calliSize = CALLI_SIZES[1], hlSize = HL_SIZES[1];
let lassoMode = 'free', palette = [], sel = null, clip = null, picking = false;
const LS = { get(k, d) { try { const v = localStorage.getItem('notation.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('notation.' + k, JSON.stringify(v)); } catch (e) { } } };
(() => { const p = LS.get('tools', null); if (p) ({ penColor = penColor, calliColor = calliColor, hlColor = hlColor, penSize = penSize, calliSize = calliSize, hlSize = hlSize, lassoMode = lassoMode } = p); palette = LS.get('palette', []); if (!HL_COLORS.includes(hlColor)) hlColor = HL_COLORS[0]; })();
const saveTools = () => LS.set('tools', { penColor, calliColor, hlColor, penSize, calliSize, hlSize, lassoMode });
let fingers = false;        // draw with fingers?
let zoom = 1;
let lead = 1;               // seconds of lead-in before a bookmark
let follow = true, loop = false, loopRange = null;
let groups = [];            // computed bookmark groups
let activeGroup = -1;
let views = [];             // per-page DOM
let undoStack = [], redoStack = [];
let rec = null;             // active recording
let audioURL = null;
const audioEl = new Audio(); audioEl.preload = 'auto';
/* page images: one Blob per page, kept in IndexedDB ('imgs'), addressed by key */
const memBlobs = new Map();   // key -> Blob (this session)
const urlCache = new Map();   // key -> object URL
async function putImg(key, blob) {
  memBlobs.set(key, blob);
  if (!viewer) await DB.put('imgs', key, { buf: await blob.arrayBuffer(), type: blob.type });
}
async function getBlob(key) {
  if (memBlobs.has(key)) return memBlobs.get(key);
  const r = await DB.get('imgs', key); if (!r) return null;
  const b = new Blob([r.buf], { type: r.type }); memBlobs.set(key, b); return b;
}
async function imgURL(key) {
  if (urlCache.has(key)) return urlCache.get(key);
  const b = await getBlob(key); if (!b) return '';
  const u = URL.createObjectURL(b); urlCache.set(key, u); return u;
}
function releaseImages() { for (const u of urlCache.values()) URL.revokeObjectURL(u); urlCache.clear(); memBlobs.clear(); images.clear(); }
const dataURLtoBlob = async u => (await fetch(u)).blob();
const images = new Map();
function loadImg(src) {
  if (!images.has(src)) images.set(src, new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }));
  return images.get(src);
}

/* ---------------- UI helpers ---------------- */
let toastTimer;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms); }
function dialog({ title, html = '', node = null, actions = [{ label: 'OK', value: true, primary: true }], dismiss = null }) {
  return new Promise(res => {
    const scrim = $('#scrim'); scrim.innerHTML = '';
    const d = document.createElement('div'); d.className = 'dlg' + (arguments[0].wide ? ' wide' : '');
    d.innerHTML = (title ? `<h2>${esc(title)}</h2>` : '') + html;
    if (node) d.appendChild(node);
    const acts = document.createElement('div'); acts.className = 'acts';
    const close = v => { scrim.classList.add('hidden'); scrim.innerHTML = ''; res(v); };
    for (const a of actions) {
      const b = document.createElement('button'); b.className = 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : '');
      b.textContent = a.label; b.onclick = () => close(a.value); acts.appendChild(b);
    }
    if (actions.length) d.appendChild(acts);
    d.close = close;
    scrim.onclick = e => { if (e.target === scrim) close(dismiss); };
    scrim.appendChild(d); scrim.classList.remove('hidden');
  });
}
function closeDialog(v) { const d = $('#scrim .dlg'); if (d) d.close(v); }

/* ---------------- geometry & drawing ---------------- */
const bbCache = new WeakMap();
function bbox(s) {
  let b = bbCache.get(s); if (b) return b;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of s.pts) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
  const r = s.tool === 'calli' ? s.size * 0.6 : s.size / 2; b = [x0 - r, y0 - r, x1 + r, y1 + r]; bbCache.set(s, b); return b;
}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = clamp(t, 0, 1);
  const x = ax + t * dx - px, y = ay + t * dy - py; return Math.sqrt(x * x + y * y);
}
function strokeHit(s, x, y, r) {
  const b = bbox(s); if (x < b[0] - r || x > b[2] + r || y < b[1] - r || y > b[3] + r) return false;
  const p = s.pts; if (p.length === 1) return Math.hypot(p[0][0] - x, p[0][1] - y) <= r + s.size / 2;
  for (let i = 1; i < p.length; i++) if (segDist(x, y, p[i - 1][0], p[i - 1][1], p[i][0], p[i][1]) <= r + s.size / 2) return true;
  return false;
}
function drawStroke(ctx, s, o = {}) {
  const p = s.pts; if (!p.length) return;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const color = o.color || s.color;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 16; }
  const extra = o.extra || 0;
  if (s.tool === 'mono') {          // even weight: one smooth path, round ends
    ctx.strokeStyle = color; ctx.lineWidth = s.size + extra;
    ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
    if (p.length === 1) ctx.lineTo(p[0][0] + 0.01, p[0][1]);
    for (let i = 1; i < p.length - 1; i++) { const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2; ctx.quadraticCurveTo(p[i][0], p[i][1], mx, my); }
    if (p.length > 1) ctx.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
    ctx.stroke();
  } else if (s.tool === 'calli') {  // broad nib: the nib's edge swept along the path, widened by pressure
    const ca = Math.cos(NIB_ANGLE), sa = Math.sin(NIB_ANGLE);
    const q = i => { const a = p[Math.max(0, i - 1)][2] || .5, b = p[i][2] || .5, c = p[Math.min(p.length - 1, i + 1)][2] || .5; return (a + 2 * b + c) / 4; };
    const half = i => s.size * (0.28 + 0.9 * q(i)) / 2 + extra / 2;
    ctx.fillStyle = color; ctx.strokeStyle = color;
    ctx.beginPath();
    if (p.length === 1) { const h = half(0); ctx.moveTo(p[0][0] - ca * h, p[0][1] - sa * h); ctx.lineTo(p[0][0] + ca * h, p[0][1] + sa * h); ctx.lineWidth = Math.max(1, s.size * 0.12) + extra; ctx.stroke(); }
    for (let i = 1; i < p.length; i++) {
      const [x0, y0] = p[i - 1], [x1, y1] = p[i], h0 = half(i - 1), h1 = half(i);
      const A = [x0 + ca * h0, y0 + sa * h0], B = [x1 + ca * h1, y1 + sa * h1], C = [x1 - ca * h1, y1 - sa * h1], D = [x0 - ca * h0, y0 - sa * h0];
      const area = (B[0] - A[0]) * (D[1] - A[1]) - (B[1] - A[1]) * (D[0] - A[0]);   // keep every quad wound the same way so the union fills without gaps
      if (area >= 0) { ctx.moveTo(...A); ctx.lineTo(...B); ctx.lineTo(...C); ctx.lineTo(...D); }
      else { ctx.moveTo(...A); ctx.lineTo(...D); ctx.lineTo(...C); ctx.lineTo(...B); }
      ctx.closePath();
    }

async function renderDrawer() {

      h.textContent = i < 0 ? 'Unlinked' : takeName(note, i); list.appendChild(h);

async function drawCrop(cv, g) {

/* ---------------- pages ---------------- */
/* Pages are laid out at full size immediately, but only pages near the screen
   get their image and drawing canvases. This keeps 100+ page books light on iPad. */
let io = null;
const ICON_DOTS = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
function buildPages() {
  const host = $('#pages');

  views.forEach((_, i) => unmountPage(i, true));
  host.innerHTML = ''; views = [];
  io = new IntersectionObserver(ents => { for (const en of ents) { const i = +en.target.dataset.i; en.isIntersecting ? mountPage(i) : unmountPage(i); } }, { root: host, rootMargin: '100% 0px' });
  note.pages.forEach((pg, i) => {
    const wrap = document.createElement('div'); wrap.className = 'page'; wrap.dataset.i = i;
    wrap.style.aspectRatio = `${pg.w}/${pg.h}`;
    wrap.style.width = `calc(min(var(--pw, 100vw) - 32px, ${pg.w >= pg.h ? 1320 : 940}px) * var(--zoom,1))`;
    const no = document.createElement('div'); no.className = 'pno'; no.textContent = `${i + 1} / ${note.pages.length}`;
    wrap.appendChild(no);
    if (!viewer) {
      const m = document.createElement('button'); m.className = 'pmenu'; m.title = 'Page options'; m.innerHTML = ICON_DOTS;
      m.onclick = e => { e.stopPropagation(); pageMenu(i); }; wrap.appendChild(m);
    }

    ap.innerHTML = `<button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add pages</button>`;

}

/* ---------------- page sidebar: a navigable index for one notebook ----------------
   Thumbnails with your ink, the page you're on, starred pages, and names you give pages. */
const Side = (() => {
  let filter = 'all', io2 = null, thumbs = [], refreshT = 0;
  const open = () => $('#editor').classList.contains('side-open');
  const overlay = () => innerWidth <= 820;
  const label = (pg, i) => pg.name || (pg.cover ? (i === 0 ? 'Cover' : 'Divider') : '');
  const sig = i => { const st = note.strokes.filter(s => s.page === i); return st.length + ':' + (st.length ? st[st.length - 1].id : '') + ':' + note.pages[i].key; };

    const t = thumbs[i]; if (!t || !note || !note.pages[i]) return;
    const sg = sig(i); if (t.sig === sg) return; t.sig = sg;
    const pg = note.pages[i], W = 360, k = W / pg.w, c = t.cv; c.width = W; c.height = Math.round(pg.h * k);
    try {
      const img = await loadImg(await imgURL(pg.key)); if (t.cv !== c) return;
      const x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);

    if (!open()) return;
    io2 = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) drawThumb(+e.target.dataset.i); }), { root: list, rootMargin: '200px 0px' });
    let shown = 0;
    note.pages.forEach((pg, i) => {
      if (filter === 'star' && !pg.star) return;
      const b = document.createElement('div'); b.className = 'ps-item'; b.dataset.i = i; b.tabIndex = 0;
      b.style.setProperty('--ar', `${pg.w}/${pg.h}`);
      const cv = document.createElement('canvas'); b.appendChild(cv);
      const cap = document.createElement('div'); cap.className = 'ps-cap';
      cap.innerHTML = `<span class="ps-no">${i + 1}</span><span class="ps-name">${esc(label(pg, i))}</span>` +
        (viewer ? (pg.star ? '<span class="ps-btn ps-star on">★</span>' : '') :
          `<button class="ps-btn ps-edit" title="Name this page">✎</button><button class="ps-btn ps-star ${pg.star ? 'on' : ''}" title="${pg.star ? 'Unstar' : 'Star'} this page">${pg.star ? '★' : '☆'}</button>`);
      b.appendChild(cap);
      b.onclick = e => {
        if (e.target.closest('.ps-star') && !viewer) { e.stopPropagation(); pg.star = !pg.star; if (!pg.star) delete pg.star; savePages(); scheduleSave(); render(); toast(pg.star ? `Page ${i + 1} starred.` : `Page ${i + 1} unstarred.`); return; }

  }
  async function rename(i) {
    const pg = note.pages[i];

  $('#psFilter').onclick = e => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.f; render(); };
  return { render, markCurrent, refreshSoon, toggle, restore: () => { filter = 'all'; const on = !overlay() && LS.get('sideOpen', false); $('#editor').classList.toggle('side-open', on); $('#tSide').classList.toggle('on', on); } };
})();

/* ---- page operations ---- */
async function pageMenu(i) {
  const n = note.pages.length;
  const v = await dialog({
    title: note.pages[i].cover ? 'Cover' : `Page ${i + 1} of ${n}`, html: '<p style="margin-top:0">Add pages after this one, move it, or remove it.</p>',
    actions: [{ label: 'Cancel', value: null }].concat(
      i === 0 ? [{ label: note.pages[0].cover ? 'Change cover' : 'Add a cover', value: 'cover' }] : [],
      i > 0 ? [{ label: 'Move up', value: 'up' }] : [], i < n - 1 ? [{ label: 'Move down', value: 'down' }] : [],
      n > 1 ? [{ label: 'Delete page', value: 'del', danger: true }] : [], [{ label: 'Add pages after', value: 'add', primary: true }]),
  });
  if (v === 'add') addPagesMenu(i);
  else if (v === 'cover') addOrChangeCover(!!note.pages[0].cover);
  else if (v === 'up' || v === 'down') movePage(i, v === 'up' ? i - 1 : i + 1);
  else if (v === 'del') {
    const marks = note.strokes.filter(s => s.page === i).length;
    const ok = await dialog({ title: `Delete page ${i + 1}?`, html: `<p>${marks ? `The page and the ${marks} ink stroke${marks === 1 ? '' : 's'} on it will be removed.` : 'This page will be removed.'} This cannot be undone.</p>`, actions: [{ label: 'Cancel', value: false }, { label: 'Delete', value: true, danger: true }] });
    if (ok) deletePage(i);
  }
}
async function addPagesMenu(after) {
  const box = document.createElement('div');
  const mk = (thumb, title, sub, fn) => { const b = document.createElement('button'); b.className = 'tpl'; b.innerHTML = `<span class="tim" ${thumb ? `style="background-image:url(${thumb})"` : ''}>${thumb ? '' : ICON_UPLOAD}</span><span><b>${esc(title)}</b><span>${esc(sub)}</span></span>`; b.onclick = () => { closeDialog(null); fn(); }; box.appendChild(b); };
  const cur = note.pages[after];
  if (!cur.cover) mk(await imgURL(cur.key), 'Copy of this page’s template', 'An identical blank page with the same background', () => insertPages(after, [{ key: cur.key, w: cur.w, h: cur.h }]));
  const pickAndInsert = async cat => { const t = await pickTemplate({ cat, tabs: true, title: `Add after page ${after + 1}`, intro: cat === 'cover' ? 'A cover design makes a handsome section divider between songs or lessons.' : cat === 'page' ? 'Song details, an index or a practice tracker, anywhere in the notebook.' : 'Choose a template for the new page.' }); if (t && typeof t === 'object') insertPages(after, [await tplPage(t, note.id)]); };
  mk(shelf('notation')[0] ? shelf('notation')[0].thumb : '', 'Notation template', 'Any tāḷa template, the plain grid, or one of your own', () => pickAndInsert('notation'));
  const dv = shelf('cover').find(t => t.id === 'cover-14') || shelf('cover')[0];
  mk(dv ? dv.thumb : '', 'Section divider', 'Any cover design, to open a new song or section', () => pickAndInsert('cover'));

  const n = pages.length;
  note.strokes.forEach(s => { if (s.page > after) s.page += n; });
  note.pages.splice(after + 1, 0, ...pages);
  await afterPageChange(); goToPage(after + 1);

}

  note.strokes.forEach(s => { if (s.page === from) s.page = to; else if (s.page === to) s.page = from; });

  note.strokes.forEach(s => { if (s.page > i) s.page -= 1; });

  async function removeLocal(id) { await DB.del('notes', id); await DB.del('pages', id); await DB.del('audio', id); await DB.delPrefix('audio', id + ':'); await DB.delPrefix('imgs', id + ':'); await DB.del('sync', 'n:' + id); }

  /* ---- settings panel ---- */
  async function openPanel() {
    const c = cfg(), box = document.createElement('div');
    if (!c.clientId || !c.connected) {
      box.innerHTML = `<p style="margin-top:0">Keep your whole library in your Google Drive, in a <b>Notation</b> folder that mirrors your folders here, and use the same notes on your iPad and on the web.</p>
        <p style="color:var(--muted);font-size:14px">Notation can only see the files it creates in your Drive, nothing else.</p>
        <label style="font-size:13px;font-weight:600">Your Google client ID</label>
        <input class="tinput" id="gcid" type="text" spellcheck="false" autocapitalize="off" placeholder="…apps.googleusercontent.com" value="${esc(c.clientId || '')}" style="font-size:14px;margin:6px 0 10px">
        <p style="color:var(--muted);font-size:13px;margin:0">Its <b>authorised redirect URI</b> must be exactly: <code style="user-select:all;-webkit-user-select:all">${esc(redirectUri())}</code></p>`;
      const v = await dialog({ title: 'Connect Google Drive', node: box, actions: [{ label: 'Cancel', value: null }, { label: 'Connect', value: 'go', primary: true }] });
      if (v !== 'go') return;
      const id = box.querySelector('#gcid').value.trim();
      if (!/\.apps\.googleusercontent\.com$/.test(id)) { dialog({ title: 'That doesn’t look like a client ID', html: '<p>It ends in <b>.apps.googleusercontent.com</b>. Copy it from Google Cloud → APIs & Services → Credentials.</p>' }); return; }
      LS.set('drive', { ...c, clientId: id }); await flushSave(); signIn('first'); return;
    }
    box.innerHTML = `<p style="margin-top:0">Connected${c.email ? ` as <b>${esc(c.email)}</b>` : ''}. Your library is mirrored in <b>Notation</b> in Google Drive.</p>
      <p style="color:var(--muted);font-size:14px">${state === 'error' ? 'Last attempt: ' + esc(detail) : lastSync ? 'Last synced ' + ago(lastSync) + '.' : 'Not synced yet.'} Changes sync automatically a few seconds after you make them.</p>`;
    const acts = [{ label: 'Close', value: null }, { label: 'Disconnect', value: 'off', danger: true }];
    acts.push(tokenValid() ? { label: 'Sync now', value: 'sync', primary: true } : { label: 'Reconnect', value: 'again', primary: true });
    const v = await dialog({ title: 'Google Drive', node: box, actions: acts });
    if (v === 'sync') sync();
    else if (v === 'again') { await flushSave(); signIn('again'); }
    else if (v === 'off') {
      const ok = await dialog({ title: 'Disconnect Google Drive?', html: '<p>Syncing stops. Your notes stay on this device and in your Drive; nothing is deleted.</p>', actions: [{ label: 'Cancel', value: false }, { label: 'Disconnect', value: true, danger: true }] });
      if (ok) { LS.set('drive', { clientId: c.clientId }); LS.set('drive.token', null); LS.set('drive.ids', {}); setState('off'); }
    }
  }
  function init() {
    if (viewer) return;
    handleRedirect();
    if (!connected()) { setState('off'); return; }
    if (tokenValid()) { setState('ok'); return; }
    // the hour-long pass has expired: quietly renew it once per launch when online
    if (navigator.onLine && !sessionStorage.getItem('drive.renewed')) { sessionStorage.setItem('drive.renewed', '1'); signIn('silent'); return 'redirecting'; }
    setState('reconnect');
  }
  addEventListener('online', () => schedule(1500));
  return { init, sync, schedule, tombstone, openPanel, renderChip, connected, maybeSync() { if (connected() && Date.now() - lastSync > 30000) sync(); else renderChip(); } };
})();


/* ================= updates =================
   version.json on GitHub names the newest build. When it differs from this one, the
   version chip offers "Update to …". Updating clears only Notation's stored app files
   and reloads; notes, recordings, folders and the Drive connection are untouched. */
const APP_VERSION = '0.20', APP_BUILD = 'c60fae895a';
const Updates = (() => {
  let latest = null, last = 0;
  const chip = () => $('#verChip');
  function render() {
    const c = chip(); if (!c) return;
    const fresh = latest && latest.build !== APP_BUILD;
    c.classList.toggle('new', !!fresh);
    c.textContent = fresh ? `Update to ${latest.version}` : `v${APP_VERSION}`;
  }
  async function check(manual) {
    if (viewer || location.protocol === 'file:') return;
    if (!manual && Date.now() - last < 15000) return;
    last = Date.now();
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) latest = await r.json();
    } catch (e) { if (manual) { toast('Could not reach GitHub. Are you online?'); return; } }
    render();
    if (!manual) return;
    if (latest && latest.build !== APP_BUILD) apply();
    else {
      const v = await dialog({ title: 'You have the latest version', html: `<p>This is Notation <b>${APP_VERSION}</b>, the newest available.</p><p style="color:var(--muted);font-size:14px">If something looks out of date, you can still refresh Notation's app files. Your notes, recordings, folders and Drive connection are kept.</p>`, actions: [{ label: 'Close', value: null }, { label: 'Refresh anyway', value: 'go' }] });
      if (v === 'go') apply();
    }
  }
  async function apply() {
    toast('Updating Notation…', 6000);
    try { if (typeof flushSave === 'function') await flushSave(); } catch (e) { }
    try { for (const k of await caches.keys()) if (k.startsWith('notation-')) await caches.delete(k); } catch (e) { }
    try { if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch (e) { }
    location.replace(location.pathname + '?v=' + Date.now());
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  setInterval(() => check(), 30 * 60000);
  return { check, apply, render };
})();
$('#verChip').onclick = () => Updates.check(true);

/* ---------------- settings & help ---------------- */
function openSettings() {
  const box = document.createElement('div');
  box.innerHTML = `
    <div class="field"><span>Lead-in before a bookmark<br><small style="color:var(--muted)">Start this much earlier when a mark is tapped</small></span><span class="seg" id="sLead">${[0, 1, 2, 3].map(n => `<button data-v="${n}" class="${lead === n ? 'on' : ''}">${n}s</button>`).join('')}</span></div>
    ${viewer ? '' : `<div class="field"><span>Draw with fingers<br><small style="color:var(--muted)">Off: only Apple Pencil / stylus draws</small></span><span class="seg" id="sFing"><button data-v="0" class="${!fingers ? 'on' : ''}">Off</button><button data-v="1" class="${fingers ? 'on' : ''}">On</button></span></div>`}
    <div style="margin-top:14px"><h2 style="font-size:19px;margin:10px 0 6px">How Notation works</h2>
    <ol style="padding-left:20px;margin:0">
      <li><b>Before class</b>, write the notation on your template with the pen.</li>
      <li><b>In class</b>, press Record. Each time a line or saṅgati begins, draw a quick mark in the margin column. Anything drawn while recording (or while audio plays) becomes an audio bookmark.</li>
      <li><b>To practise</b>, tap any mark with your finger (or choose the Point tool) to hear that passage. Loop repeats it up to the next bookmark, and you can play it at 0.5× to 2×.</li>
      <li><b>As a teacher</b>, import or record the audio, play it back, and draw marks as you listen. Then use Share to publish a link that plays everything, for anyone you send it to.</li>
    </ol></div>
    ${viewer ? '' : `<div class="field"><span>Share links<br><small style="color:var(--muted)">${Publish.ready() ? 'Set up on this device' : 'Publish players to your notation repository on GitHub'}</small></span><button class="btn" id="sGh">${Publish.ready() ? 'View' : 'Set up'}</button></div>`}
    ${viewer ? '' : `<div class="field"><span>Quarterly tidy-up reminder<br><small style="color:var(--muted)">A gentle note on 1 Jan, 1 Apr, 1 Jul and 1 Oct</small></span><span class="seg" id="sNudge"><button data-v="0" class="${!Nudge.on() ? 'on' : ''}">Off</button><button data-v="1" class="${Nudge.on() ? 'on' : ''}">On</button></span></div>`}
    <p style="color:var(--muted);font-size:13px;margin-top:14px">Notation ${APP_VERSION} · © 2026 Lakshmi Ganesan. All rights reserved. Notes are stored on this device.</p>
    <div style="margin-top:10px"><button class="btn" id="sUpdate">Check for updates</button></div>`;
  box.querySelector('#sLead').onclick = e => { const b = e.target.closest('button'); if (!b) return; lead = +b.dataset.v; $$('#sLead button').forEach(x => x.classList.toggle('on', x === b)); if (loop) setLoopFromTime(audioEl.currentTime); };
  const sn = box.querySelector('#sNudge'); if (sn) sn.onclick = e => { const b = e.target.closest('button'); if (!b) return; Nudge.set(!!+b.dataset.v); $$('#sNudge button').forEach(x => x.classList.toggle('on', x === b)); };
  const gh = box.querySelector('#sGh'); if (gh) gh.onclick = () => { closeDialog(null); Publish.setup(); };
  box.querySelector('#sUpdate').onclick = () => { closeDialog(null); Updates.check(true); };
  const sf = box.querySelector('#sFing'); if (sf) sf.onclick = e => { const b = e.target.closest('button'); if (!b) return; if (!!+b.dataset.v !== fingers) $('#tFingers').click(); $$('#sFing button').forEach(x => x.classList.toggle('on', x === b)); };
  dialog({ title: 'Settings', node: box, actions: [{ label: 'Done', value: true, primary: true }] });
}

/* ---------------- boot ---------------- */
$('#btnNew').onclick = () => newNote();
$('#driveChip').onclick = () => Drive.openPanel();
$('#btnLib').onclick = openTemplateLibrary;
(async () => {
  renderSwatches(); updUndo();
  const shared = ($('#shared-note').textContent || '').trim();
  if (shared) {
    viewer = true; document.body.classList.add('viewer');
    try { const d = JSON.parse(shared); if (d.lead != null) lead = d.lead; note = await dataToNote(d); showEditor(); booted = true; }
    catch (e) { document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">This shared note could not be read.</p>'; }
    return;
  }
  // Library-first; first visit opens straight onto a fresh Ādi page so the app is never blank.
  await loadMine(); await loadFolders();
  if (Drive.init() === 'redirecting') return;
  await showLibrary(); booted = true; hideBootNotice();
  if (location.search.includes('v=')) history.replaceState(null, '', location.pathname);   // tidy the address after an update
  setTimeout(() => Updates.check(), 1500);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { });
})();
