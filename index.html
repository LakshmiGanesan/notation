<style>
:root{
  --ink:#14182e; --navy:#0e1120; --paper:#fbf8f2; --desk:#efe8db; --card:#fffdf9;
  --saffron:#d9731a; --saffron-2:#b85d10; --saffron-soft:#f8e3cd;
  --line:#e3d9c8; --muted:#6f685b; --rec:#c8372d; --ok:#2f7d55;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:15px}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
input[type=text]{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}

/* ---------- Library ---------- */
#library{min-height:100%;padding:calc(28px + var(--sat)) calc(28px + var(--sar)) calc(40px + var(--sab)) calc(28px + var(--sal));max-width:1360px;margin:0 auto}
.lib-body{display:grid;grid-template-columns:240px 1fr;gap:30px;align-items:start}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px}
.side h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 10px 6px;font-weight:600}
.fitem{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;padding:0 6px 0 10px;border:none;background:transparent;border-radius:11px;text-align:left;font-size:15px}
.fitem:hover{background:rgba(255,253,249,.7)}
.fitem.on{background:var(--card);box-shadow:0 1px 0 var(--line),0 6px 14px -12px rgba(14,17,32,.5);font-weight:600}
.fitem.sub{padding-left:34px;font-size:14px;min-height:40px}
.fitem svg.fi{width:19px;height:19px;flex:none;color:var(--saffron)}
.fitem.sub svg.fi{width:16px;height:16px;opacity:.8}
.fitem .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem .ct{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.fitem .fm{width:32px;height:32px;border-radius:8px;border:none;background:transparent;display:grid;place-items:center;opacity:.55;flex:none}
.fitem .fm:hover{opacity:1;background:#efe6d6}
.fitem .fm svg{width:16px;height:16px}
.newf{color:var(--saffron-2);font-weight:500}
.side .shead{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}.side .shead h4{margin:0 10px}
.side .arr{border:none;background:none;color:var(--saffron-2);font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;min-height:32px}
.side .arr:hover{background:#efe6d6}.side.arranging .arr{background:var(--saffron-2);color:#fff}
.fblock{display:flex;flex-direction:column;gap:2px;transition:transform .16s ease}
.fitem .fg{display:none;width:26px;height:32px;place-items:center;color:var(--muted);flex:none}.fitem .fg svg{width:17px;height:17px}
.side.arranging .fitem.mv{touch-action:none;cursor:grab;background:rgba(255,253,249,.55);box-shadow:inset 0 0 0 1px var(--line);transition:transform .16s ease}
.side.arranging .fitem.mv .fg{display:grid}.side.arranging .fitem.mv .ct,.side.arranging .fitem .fm{display:none}
.side.arranging .fitem.fix{opacity:.45;pointer-events:none}.side.arranging .fitem.on:not(.mv){box-shadow:none;background:none}
.side.arranging .newf{display:none}.side.arranging .fitem.mv:focus-visible{outline:2px solid var(--saffron)}
.side .dragging{transition:none!important;position:relative;z-index:3;box-shadow:0 12px 26px -10px rgba(0,0,0,.35)!important;background:var(--card)!important;border-radius:11px;cursor:grabbing}
.side.sorting{user-select:none;-webkit-user-select:none}
.fcols{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.fcols button{width:48px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.fcols button svg{width:24px;height:24px;color:var(--saffron)}
.fcols button.on{border-color:var(--saffron);box-shadow:0 0 0 3px var(--saffron-soft)}
.fcap{color:var(--muted);font-size:12.5px;margin:0 0 8px}
.crumb{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.crumb h2{font-family:var(--serif);font-weight:500;font-size:26px;margin:0}
.crumb .up{font-family:var(--serif);font-size:26px;color:var(--muted);cursor:pointer}
.crumb .cnt{color:var(--muted);font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.fgrid:empty{display:none}
.ftile{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;cursor:pointer;min-height:64px}
.ftile:hover{border-color:var(--saffron)}
.ftile svg{width:26px;height:26px;color:var(--saffron);flex:none}
.ftile b{font-family:var(--serif);font-weight:500;font-size:17px;display:block}
.ftile span{color:var(--muted);font-size:12px}
.ftile.add{border-style:dashed;color:var(--saffron-2)}
.fpick{display:flex;flex-direction:column;gap:4px}
.fpick button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:44px;padding:0 14px;display:flex;align-items:center;gap:10px;font-size:15px}
.fpick button.sub{margin-left:26px;font-size:14px}
.fpick button.on{border-color:var(--saffron);background:var(--saffron-soft)}
.fpick svg{width:17px;height:17px;color:var(--saffron)}
.tinput{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.tinput:focus{border-color:var(--saffron)}
@media (max-width:820px){
  .lib-body{grid-template-columns:1fr;gap:14px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
  .side h4{display:none}
  .fitem,.fitem.sub{width:auto;flex:none;padding:0 12px;border:1px solid var(--line);background:var(--card)}
  .fitem .fm{display:none}
  .fblock{display:contents}.side .shead{display:none}
}
.lib-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.wordmark{font-family:var(--serif);font-weight:650;font-size:42px;letter-spacing:-.02em;line-height:1;margin:0;display:flex;align-items:center;gap:12px}
.wordmark .mark{width:52px;height:52px;border-radius:13px;box-shadow:0 8px 18px -10px rgba(14,17,32,.6)}
.tagline{color:var(--muted);margin:8px 0 0 2px;font-size:15px}
.lib-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:500;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn:hover{border-color:#cdbfa8}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#23284a}
.btn.danger{color:var(--rec)}
.verchip{font-size:13px;color:var(--muted);padding:10px 12px}
.verchip.new{color:#fff;background:var(--saffron);border-color:var(--saffron);font-weight:600}
.drivechip span{font-variant-numeric:tabular-nums}
.drivechip.warn{color:var(--saffron-2);border-color:#ecc49c;background:var(--saffron-soft)}
.drivechip.spin svg{animation:pulse 1.2s infinite}
.btn svg{width:18px;height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;transition:transform .15s,box-shadow .15s;cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(20,24,46,.35)}
.nudge{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;background:#fbf3e6;border:1px solid #ecd9b8;border-left:4px solid #c8641e;border-radius:16px;padding:18px 22px;margin:0 0 22px}
.nudge-txt{flex:1 1 420px;font-size:15px;line-height:1.55}.nudge-txt p{margin:0 0 6px}.nudge-hi{font-family:var(--serif,Georgia,serif);font-size:20px}
.nudge-txt ol{margin:6px 0 0;padding-left:20px}.nudge-acts{display:flex;flex-wrap:wrap;gap:8px}.nudge-acts a.btn{text-decoration:none;color:inherit}
#backPill{position:absolute;left:20px;bottom:calc(var(--plh,72px) + 14px);z-index:15;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 18px 10px 14px;background:#14182e;color:#fff;font-weight:600;font-size:14px;line-height:1;font-family:inherit;box-shadow:0 6px 20px rgba(20,24,46,.25);cursor:pointer}
#backPill svg{width:18px;height:18px}
.linkflash{position:absolute;background:rgba(200,100,30,.28);border-radius:4px;pointer-events:none;animation:lf .7s ease-out forwards}
@keyframes lf{from{opacity:1}to{opacity:0}}
.zrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px}
.zb{width:52px;height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:500;font-size:24px;line-height:1;font-family:inherit;color:inherit;cursor:pointer}
#zPct{font-size:18px;font-weight:600;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.zgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:236px}.zgrid button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 8px;font:inherit;font-size:14px;color:inherit;cursor:pointer}
.zgrid button.on{background:#14182e;color:#fff;border-color:#14182e}
.page{container-type:inline-size}
.tl{position:absolute;inset:0;pointer-events:none;z-index:3}

.playbtn svg{width:22px;height:22px}
.playbtn:disabled{opacity:.3;cursor:default}
.skipbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;flex:none;padding:0;cursor:pointer;margin:0 -4px}
.skipbtn svg{width:26px;height:26px}.skipbtn text{font:700 7.5px/1 system-ui,-apple-system,sans-serif;fill:currentColor;stroke:none}
.skipbtn:active:not(:disabled){background:var(--saffron-soft)}
.skipbtn:disabled{opacity:.3;cursor:default}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap;min-width:92px;text-align:center}
.time b{color:var(--ink);font-weight:600}
.track{flex:1;height:44px;position:relative;cursor:pointer;touch-action:none;min-width:80px}
.track .rail{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:#e6dccb}
.track .fill{position:absolute;left:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--ink);width:0}
.track .knob{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:2px solid var(--ink);left:0;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.track .tick{position:absolute;top:8px;width:3px;height:10px;margin-left:-1.5px;border-radius:2px;background:var(--saffron)}
.track .tick.on{background:var(--rec);height:14px;top:5px}
.pill{height:38px;border-radius:19px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.pill svg{width:16px;height:16px}
.pill.on{background:var(--saffron-soft);border-color:#ecc49c;color:var(--saffron-2)}
.pill:disabled{opacity:.35}

/* bookmarks drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);background:var(--paper);border-left:1px solid var(--line);box-shadow:-20px 0 40px -30px rgba(20,24,46,.5);transform:translateX(105%);transition:transform .25s ease;z-index:30;display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab)}
#drawer.open{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px 18px;border-bottom:1px solid var(--line)}
.dh h3{font-family:var(--serif);font-weight:500;font-size:20px;margin:0}
.dlist{overflow:auto;padding:10px;flex:1}
.bm{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px;margin-bottom:8px;cursor:pointer}
.bm.on{border-color:var(--saffron);box-shadow:0 0 0 3px var(--saffron-soft)}
.bm canvas{width:100%;display:block;border-radius:6px;background:#fff}
.bm .row{display:flex;align-items:center;gap:6px;margin-top:6px}
.bm .t{font-weight:600;font-variant-numeric:tabular-nums}
.bm .pg{color:var(--muted);font-size:12px;flex:1}
.mini{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.mini svg{width:16px;height:16px}
.bmhead{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--saffron-2);margin:12px 4px 6px}
.dempty{color:var(--muted);padding:18px 10px;line-height:1.55;font-size:14px}

/* dialogs & toast */
#scrim{position:fixed;inset:0;background:rgba(14,17,32,.38);z-index:50;display:grid;place-items:center;padding:20px}
.dlg{background:var(--paper);border-radius:18px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.dlg h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:0 0 10px}
.dlg.hasx{position:relative}.dlg.hasx h2{padding-left:44px;margin-bottom:16px}.dlgx{position:absolute;left:16px;top:18px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:15px;color:inherit;cursor:pointer;display:grid;place-items:center}
.dlg.hasx .acts{flex-wrap:wrap}
.dlg p,.dlg li{line-height:1.55;color:#3b3a40}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.dlg.wide{max-width:900px}
.card .twobadge{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 8px;border:0;border-radius:999px;background:#8a4fc4;color:#fff;font-weight:600;font-size:12px;line-height:1.2;font-family:inherit;box-shadow:0 1px 4px rgba(0,0,0,.18);cursor:pointer}
.card .twobadge svg{width:13px;height:13px}.card .twobadge.low{top:38px}
.vers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vcard{border:1px solid var(--line);background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.vcard .vth{aspect-ratio:1194/834;background:#f3ede2 center/cover no-repeat;border-bottom:1px solid var(--line)}
.vcard .vbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1;font-size:13.5px}
.vcard .vwho{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vcard .vnew{font-size:11px;font-weight:600;color:#fff;background:var(--ok);border-radius:999px;padding:2px 8px}
.vcard .vsub{color:var(--muted)}.vcard .vonly{color:var(--saffron-2);font-weight:500}
.vcard .btn{justify-content:center;width:100%}.vcard .vsp{flex:1;min-height:10px}
.vcap{color:var(--muted);font-size:13px;margin:12px 2px 0}
@media (max-width:560px){.vers{grid-template-columns:1fr}}
.tabs{margin:0 0 14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tcard{position:relative;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:border-color .15s,transform .15s}
.tcard:hover,.tcard:focus{border-color:var(--saffron);outline:none;transform:translateY(-1px)}
.tcard .tthumb{aspect-ratio:2388/1668;border-radius:8px;background:#fff center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);margin-bottom:5px}
.tcard .tthumb svg{width:30px;height:30px}
.tcard b{font-family:var(--serif);font-weight:500;font-size:16px}
.tcard span{color:var(--muted);font-size:12px;line-height:1.35}
.tcard .tplus,.tcard .tnone{line-height:1;font-size:34px;font-weight:300;color:var(--saffron)}
.tdel{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:17px;line-height:1;display:grid;place-items:center}
.tpl{display:flex;gap:14px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px;margin:10px 0;cursor:pointer;width:100%;text-align:left}
.tpl:hover{border-color:var(--saffron)}
.tpl .tim{width:120px;aspect-ratio:2388/1668;border-radius:6px;background:#fff center/cover no-repeat;border:1px solid var(--line);flex:none;display:grid;place-items:center;color:var(--muted)}
.tpl .tim svg{width:30px;height:30px}
.tpl b{font-family:var(--serif);font-weight:500;font-size:17px;display:block}
.tpl span{color:var(--muted);font-size:13px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.field>span:first-child{flex:1;min-width:0}.field>.seg,.field>.btn,.field>select{flex:none}.field{min-height:44px}.field .seg button{white-space:nowrap}
.gsel{flex:none;width:auto;min-width:190px;font-size:14px;padding:6px 8px}
.sgrp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 0;font-weight:600}.sgrp:first-child{margin-top:0}
.field:last-child{border-bottom:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--card);padding:8px 12px;font-size:13px;font-weight:600}
.seg button.on{background:var(--ink);color:#fff}
 #bootNotice{position:fixed;inset:0;z-index:100;background:var(--desk);display:grid;place-items:center;padding:24px}
#bootNotice .bn{max-width:520px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 20px 40px -20px rgba(0,0,0,.35)}
#bootNotice h2{font-family:var(--serif);font-weight:500;margin:0 0 10px}
#bootNotice p{line-height:1.55;color:#3b3a40}
#bootNotice pre{white-space:pre-wrap;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px}
#bootNotice button{margin-top:8px;min-height:44px;padding:0 18px;border-radius:12px;border:none;background:var(--ink);color:#fff;font:inherit;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13px;padding:8px 14px;border-radius:20px;z-index:5;white-space:nowrap;box-shadow:0 8px 20px -10px rgba(0,0,0,.5)}

/* viewer mode (shared file) */
body.viewer .edit-only{display:none!important}
.sharelink{word-break:break-all;background:var(--paper,#f6f3ec);border-radius:10px;padding:10px 12px;font-size:15px;margin:6px 0 10px}
.sharelink a{color:inherit}
.sharerow{display:flex;gap:10px;align-items:center}.sharerow .sharelink{flex:1;margin:6px 0}
.sharerow .shareuntil{flex:1}.sharerow .btn{white-space:nowrap}
.viewer-only{display:none}
body.viewer .viewer-only{display:inline-flex}
.vtitle{font-family:var(--serif);font-weight:500;font-size:19px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vby{color:var(--muted);font-size:12px;white-space:nowrap}

@media (max-width:760px){
  .time{min-width:0}
  .hide-sm{display:none!important}
  .wordmark{font-size:34px}
}

  let takes = meta.takes;
  if (!takes) {
    const old = await DB.get('audio', id); takes = [];
    if (old && old.buf) {
      takes = [{ id: 'a1', label: '', mime: old.mime || 'audio/mp4', duration: meta.duration || 0, created: meta.created || Date.now(), size: old.buf.byteLength }];
      await DB.put('audio', id + ':a1', old); await DB.del('audio', id);
    }
    (meta.strokes || []).forEach(s => { if (s.t != null && !s.take) s.take = 'a1'; });
  }
  for (const t of takes) { const r = await DB.get('audio', id + ':' + t.id); if (r && r.buf) takeBlobs.set(t.id, new Blob([r.buf], { type: r.mime || t.mime })); }
  return takes.filter(t => takeBlobs.has(t.id));
}
async function saveTake(t, blob) { if (!viewer) await DB.put('audio', note.id + ':' + t.id, { buf: await blob.arrayBuffer(), mime: blob.type || t.mime }); }
function selectTake(id) {
  return new Promise(res => {
    if (!note || !id || !takeBlobs.has(id)) { curTake = null; setAudio(null); return res(); }
    if (id === curTake && audioEl.getAttribute('src')) return res();
    curTake = id; activeGroup = -1; loopRange = null;
    const done = () => { audioEl.removeEventListener('loadedmetadata', done); clearTimeout(tm); res(); };
    const tm = setTimeout(done, 3000);
    audioEl.addEventListener('loadedmetadata', done);
    setAudio(takeBlobs.get(id)); renderAllFx();
  });
}

/* ---------------- bookmark groups ---------------- */
function computeGroups() {
  const order = id => { const i = note.takes ? takeIdx(id) : -1; return i < 0 ? 999 : i; };

  const out = [];
  for (const s of bs) {
    const b = bbox(s), cy = (b[1] + b[3]) / 2, last = out[out.length - 1];
    if (last && last.take === s.take && last.page === s.page && s.t - last.tEnd < 2 && Math.abs(cy - last.cy) < 22 * pageScale(note.pages[s.page] || { w: 1920, h: 0 })) {
      last.strokes.push(s); last.tEnd = s.t;
      last.bb = [Math.min(last.bb[0], b[0]), Math.min(last.bb[1], b[1]), Math.max(last.bb[2], b[2]), Math.max(last.bb[3], b[3])];
    } else out.push({ page: s.page, take: s.take, t: s.t, tEnd: s.t, cy, bb: [...b], strokes: [s] });
  }
  out.forEach((g, i) => g.i = i);
  groups = out;
  const n = groups.length; const bc = $('#bmCount'); bc.textContent = n; bc.classList.toggle('hidden', !n);
  renderTicks(); if ($('#drawer').classList.contains('open')) renderDrawer();
}

function setActive(k, scroll) {
  if (k === activeGroup) return;
  const prev = groups[activeGroup]; activeGroup = k;
  if (prev) renderFx(prev.page);
  const g = groups[k]; if (g) renderFx(g.page);
  $$('#pTicks .tick').forEach(t => t.classList.toggle('on', +t.dataset.i === k));
  $$('#dList .bm').forEach(b => b.classList.toggle('on', +b.dataset.i === k));
  if (g && scroll && follow) scrollToGroup(g);
}
async function jumpToGroup(g, scroll = true) {
  if (g.take && g.take !== curTake) await selectTake(g.take);
  playFrom(g.t); setActive(g.i, false); if (scroll) scrollToGroup(g);
}
function scrollToGroup(g) {
  const v = views[g.page]; if (!v) return;
  const host = $('#pages'), wrap = v.wrap;
  const y = wrap.offsetTop + (g.cy / v.pg.h) * wrap.clientHeight;
  const top = host.scrollTop, h = host.clientHeight;
  if (y < top + h * 0.2 || y > top + h * 0.75) host.scrollTo({ top: Math.max(0, y - h * 0.35), behavior: 'smooth' });
}

function playFrom(t) {

  if (rec) return;
  audioEl.currentTime = Math.max(0, t - lead);
  if (loop) setLoopFromTime(Math.max(0, t - lead));

}

$('#pBack').onclick = () => skipBy(-10);

// scrubbing
(() => {
  const tr = $('#pTrack'); let drag = false;

/* Recording quality: ask each device for the best it can do. "Music" mode switches off all voice-call
   processing (echo cancelling, noise suppression, automatic gain) so the voice and instrument sound as
   they are; "Voice" mode keeps them for a noisy room. We ask for 48 kHz, stereo where the device has it,
   and record at a high bitrate. A chosen external microphone is used whenever it is plugged in. */
const RecQ = {
  mode: () => LS.get('rec.mode', 'music'),
  dev: () => LS.get('rec.dev', ''),
  constraints(dev) {
    const music = RecQ.mode() !== 'voice';
    return { audio: { ...(dev ? { deviceId: { exact: dev } } : {}), echoCancellation: !music ? true : false, noiseSuppression: !music, autoGainControl: !music, voiceIsolation: false,

  },
  async stream() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) { }
    const dev = RecQ.dev();
    try { return await navigator.mediaDevices.getUserMedia(RecQ.constraints(dev)); }
    catch (e) { if (dev && (e.name === 'OverconstrainedError' || e.name === 'NotFoundError')) return navigator.mediaDevices.getUserMedia(RecQ.constraints('')); throw e; }
  },
  release() { try { if (navigator.audioSession) navigator.audioSession.type = 'auto'; } catch (e) { } },
  // Level (0.34): Music mode hands over the microphone's raw signal, and the iPad's built-in mics are quiet
  // without the gain that Voice Memos or Notability add, so Notation lifts the voice itself (see mixInto).
  // The lift each microphone settled at is remembered in rec.lift and starts its next take.
  // Only built-in mics are lifted (0.37); browsers name them "iPad Microphone", "MacBook Pro Microphone
  // (Built-in)", "Built-in Microphone" and the like. Anything else, such as "Yeti Stereo Microphone", is external.
  builtIn(label) {
    const l = (label || '').replace(/^default\s*-\s*/i, '');
    if (!l) return /iPad|iPhone/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
    return /built-?in|internal|\b(ipad|iphone|macbook|imac|mac mini|mac studio|mac pro)\b/i.test(l);
  },
  lift: (mic, db) => { const m = LS.get('rec.lift', {}) || {}; if (db === undefined) return m[mic || '-'] || 0; m[mic || '-'] = db; LS.set('rec.lift', m); },
  describe(q) { return q ? [q.sr ? `${Math.round(q.sr / 100) / 10} kHz` : '', q.ch === 2 ? 'stereo' : q.ch === 1 ? 'mono' : '', q.kbps ? `${q.kbps} kbps` : '', q.mic, q.lift ? `level +${q.lift} dB` : '', q.shruti ? 'with śruti' : '', q.talam ? `tāḷam ${q.talam}` : ''].filter(Boolean).join(' · ') : ''; },

/* ================= two versions of one note (0.39) =================
   When the same note was changed on two devices before they could sync, Notation keeps both
   aside, changes nothing in Drive for that note, and asks which version to keep: on whichever
   device sees both first, when a sync finishes, when you open the note, or from the purple
   "2 versions" badge on its card. Closing the question decides later. Copies named
   "… (other device)" made by versions before 0.39 are offered the same way, paired with their original. */

  const SUFFIX = ' (other device)', later = new Set();

    if (/iPhone/.test(u)) return 'iPhone';

      const base = t.slice(0, -SUFFIX.length) || 'Untitled';

      <div class="vwho">${esc(label)}${newer ? '<span class="vnew">Newer</span>' : ''}</div>
      <div class="vsub">Edited ${esc(when(s.updated))}</div>
      <div class="vsub">${plural(s.pages || 0, 'page')} · ${plural((s.takes || []).length, 'recording')}${dur ? ` (${fmt(dur)})` : ''}${s.bm ? ` · ${plural(s.bm, 'bookmark')}` : ''}</div>

})();

/* ================= updates =================
   version.json on GitHub names the newest build. When it differs from this one, the
   version chip offers "Update to …". Updating clears only Notation's stored app files
   and reloads; notes, recordings, folders and the Drive connection are untouched. */
const APP_VERSION = '0.44', APP_BUILD = '1e2fe91094';
const Updates = (() => {
  let latest = null, last = 0;
  const chip = () => $('#verChip');
  function render() {
    const c = chip(); if (!c) return;
    const fresh = latest && latest.build !== APP_BUILD;
    c.classList.toggle('new', !!fresh);
    c.textContent = fresh ? `Update to ${latest.version}` : `v${APP_VERSION}`;
  }
  async function check(manual) {
    if (viewer || location.protocol === 'file:') return;
    if (!manual && Date.now() - last < 15000) return;
    last = Date.now();
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) latest = await r.json();
    } catch (e) { if (manual) { toast('Could not reach GitHub. Are you online?'); return; } }
    render();
    if (!manual) return;
    if (latest && latest.build !== APP_BUILD) apply();
    else {
      const v = await dialog({ title: 'You have the latest version', html: `<p>This is Notation <b>${APP_VERSION}</b>, the newest available.</p><p style="color:var(--muted);font-size:14px">If something looks out of date, you can still refresh Notation's app files. Your notes, recordings, folders and Drive connection are kept.</p>`, actions: [{ label: 'Close', value: null }, { label: 'Refresh anyway', value: 'go' }] });
      if (v === 'go') apply();
    }
  }
  async function apply() {
    toast('Updating Notation…', 6000);
    try { if (typeof flushSave === 'function') await flushSave(); } catch (e) { }
    try { for (const k of await caches.keys()) if (k.startsWith('notation-')) await caches.delete(k); } catch (e) { }
    try { if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch (e) { }
    location.replace(location.pathname + '?v=' + Date.now());
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  setInterval(() => check(), 30 * 60000);
  return { check, apply, render };
})();
$('#verChip').onclick = () => Updates.check(true);

/* ---------------- settings & help ---------------- */
function openSettings() {
  const box = document.createElement('div');
  box.innerHTML = `
    <h6 class="sgrp">Playing</h6>
    <div class="field"><span>Lead-in before a bookmark<br><small style="color:var(--muted)">Start this much earlier when a mark is tapped</small></span><span class="seg" id="sLead">${[0, 1, 2, 3].map(n => `<button data-v="${n}" class="${lead === n ? 'on' : ''}">${n}s</button>`).join('')}</span></div>
    ${viewer ? '' : `<h6 class="sgrp">Finger gestures</h6>
    <div class="field"><span>Undo</span>${Gest.select('undo', [[2, 'Two-finger tap'], [3, 'Three-finger tap'], [0, 'Off']])}</div>
    <div class="field"><span>Redo</span>${Gest.select('redo', [[3, 'Three-finger tap'], [2, 'Two-finger tap'], [0, 'Off']])}</div>
    <h6 class="sgrp">Writing</h6>
    <div class="field"><span>Draw with fingers<br><small style="color:var(--muted)">Off: only Apple Pencil / stylus draws</small></span><span class="seg" id="sFing"><button data-v="0" class="${!fingers ? 'on' : ''}">Off</button><button data-v="1" class="${fingers ? 'on' : ''}">On</button></span></div>`}
    ${viewer ? '' : `<h6 class="sgrp">Recording</h6>
    <div class="field"><span>Microphone<br><small style="color:var(--muted)">An external mic is used whenever it's connected</small></span><select class="tinput" id="sMic" style="max-width:220px;font-size:14px;padding:6px 8px"><option value="">Built-in / default</option></select></div>
    <div class="field"><span>Recording mode<br><small style="color:var(--muted)">Music: for singing<br>Voice: for speaking</small></span><span class="seg" id="sRecMode"><button data-v="music" class="${RecQ.mode() !== 'voice' ? 'on' : ''}">Music</button><button data-v="voice" class="${RecQ.mode() === 'voice' ? 'on' : ''}">Voice</button></span></div>`}
    ${viewer ? '' : Shruti.settingsHtml()}
    ${viewer ? '' : Talam.settingsHtml()}
    ${viewer ? '' : `<h6 class="sgrp">Sharing</h6>
    <div class="field"><span>Share links<br><small style="color:var(--muted)">${Publish.ready() ? 'Set up on this device' : 'Publish players to your notation repository on GitHub'}</small></span><button class="btn" id="sGh">${Publish.ready() ? 'View' : 'Set up'}</button></div>`}
    ${viewer ? '' : `<h6 class="sgrp">Notation</h6>
    <div class="field"><span>Quarterly tidy-up reminder<br><small style="color:var(--muted)">A gentle note on 1 Jan, 1 Apr, 1 Jul and 1 Oct</small></span><span class="seg" id="sNudge"><button data-v="0" class="${!Nudge.on() ? 'on' : ''}">Off</button><button data-v="1" class="${Nudge.on() ? 'on' : ''}">On</button></span></div>`}
    <p style="color:var(--muted);font-size:13px;margin-top:14px">Notation ${APP_VERSION} · © 2026 Lakshmi Ganesan. All rights reserved. Notes are stored on this device.</p>
    <div style="margin-top:10px"><button class="btn" id="sUpdate">Check for updates</button></div>`;
  box.querySelector('#sLead').onclick = e => { const b = e.target.closest('button'); if (!b) return; lead = +b.dataset.v; $$('#sLead button').forEach(x => x.classList.toggle('on', x === b)); if (loop) setLoopFromTime(audioEl.currentTime); };
  const rm = box.querySelector('#sRecMode'); if (rm) rm.onclick = e => { const b = e.target.closest('button'); if (!b) return; LS.set('rec.mode', b.dataset.v); $$('#sRecMode button').forEach(x => x.classList.toggle('on', x === b)); };
  const mic = box.querySelector('#sMic');
  if (mic) {
    RecQ.mics().then(list => {
      const cur = RecQ.dev(), named = list.filter(d => d.deviceId && d.deviceId !== 'default' && d.label);
      for (const d of named) { const o = document.createElement('option'); o.value = d.deviceId; o.textContent = d.label.replace(/\s*\(.*?\)\s*$/, ''); mic.appendChild(o); }
      if (!named.length) { const o = document.createElement('option'); o.disabled = true; o.textContent = 'Record once to list microphones'; mic.appendChild(o); }
      mic.value = named.some(d => d.deviceId === cur) ? cur : '';
    });
    mic.onchange = () => { LS.set('rec.dev', mic.value); toast(mic.value ? 'Notation will record with this microphone.' : 'Notation will use the default microphone.'); };
  }
  box.querySelectorAll('select[data-gest]').forEach(el => el.onchange = () => { Gest.set(el.dataset.gest, +el.value); box.querySelectorAll('select[data-gest]').forEach(o => o.value = Gest.get()[o.dataset.gest]); });
  Shruti.wireSettings(box); Talam.wireSettings(box);
  const sn = box.querySelector('#sNudge'); if (sn) sn.onclick = e => { const b = e.target.closest('button'); if (!b) return; Nudge.set(!!+b.dataset.v); $$('#sNudge button').forEach(x => x.classList.toggle('on', x === b)); };
  const gh = box.querySelector('#sGh'); if (gh) gh.onclick = () => { closeDialog(null); Publish.setup(); };
  box.querySelector('#sUpdate').onclick = () => { closeDialog(null); Updates.check(true); };
  const sf = box.querySelector('#sFing'); if (sf) sf.onclick = e => { const b = e.target.closest('button'); if (!b) return; if (!!+b.dataset.v !== fingers) $('#tFingers').click(); $$('#sFing button').forEach(x => x.classList.toggle('on', x === b)); };
  dialog({ title: 'Settings', node: box, actions: [{ label: 'Done', value: true, primary: true }] });
}

/* ---------------- boot ---------------- */
$('#btnNew').onclick = () => newNote();
$('#driveChip').onclick = () => Drive.openPanel();
$('#btnLib').onclick = openTemplateLibrary;
(async () => {
  renderSwatches(); updUndo();
  const shared = ($('#shared-note').textContent || '').trim();
  if (shared) {
    viewer = true; document.body.classList.add('viewer');
    let d = null; try { d = JSON.parse(shared); } catch (e) { }
    if (d && await watchShareEnd(d)) return;   // a time-bound link past its end
    try { if (d.lead != null) lead = d.lead; note = await dataToNote(d); showEditor(); booted = true; }
    catch (e) { document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">This shared note could not be read.</p>'; }
    return;
  }
  // Library-first; first visit opens straight onto a fresh Ādi page so the app is never blank.
  await loadMine(); await loadFolders();
  if (Drive.init() === 'redirecting') return;
  let place = null; try { place = JSON.parse(sessionStorage.getItem('drive.place') || 'null'); sessionStorage.removeItem('drive.place'); } catch (e) { }
  if (place && place.folder) curFolder = place.folder;   // back from a quiet Drive renewal: same folder, same spot
  await showLibrary(); booted = true; hideBootNotice();
  if (place) { if (place.y) scrollTo(0, place.y); Drive.schedule(1000); }   // and carry on syncing at once
  if (location.search.includes('v=')) history.replaceState(null, '', location.pathname);   // tidy the address after an update
  setTimeout(() => Updates.check(), 1500);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
